<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hosseintalab Liquid Glass Carousel Slides</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 48px 24px 80px; background: #0d241d; color: #f4efe5; font-family: Arial, sans-serif; }
      header { width: min(1180px, 100%); margin: 0 auto 42px; }
      h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(2rem, 5vw, 4.5rem); font-weight: 400; }
      header p { max-width: 760px; margin: 18px 0 0; color: rgba(255,255,255,.62); line-height: 1.7; }
      .grid { display: grid; width: min(1180px, 100%); margin: 0 auto; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 34px; }
      article { padding-bottom: 18px; border-bottom: 1px solid rgba(214,168,93,.35); }
      img { display: block; width: 100%; height: auto; border: 1px solid rgba(214,168,93,.38); }
      h2 { margin: 15px 0 5px; color: #ead6ad; font-family: Georgia, serif; font-size: 1rem; font-weight: 500; letter-spacing: .08em; }
      a { color: rgba(255,255,255,.7); font-size: .8rem; }
      @media (max-width: 820px) { .grid { grid-template-columns: repeat(2,minmax(0,1fr)); } }
      @media (max-width: 520px) { body { padding-inline: 12px; } .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header><h1>Liquid Glass · Latin Information Slides</h1><p>Twenty finished 1080 × 1350 carousel slides. Every slide uses the approved Hosseintalab lockup, the untouched full-frontal product photograph, and only catalog facts that are currently verified.</p></header>
    <main class="grid" id="grid"></main>
    <script>
      const SKUS = ["HT-KSH-0001","HT-KHY-0001","HT-KRM-0001","HT-NHV-0001","HT-RVR-0001","HT-QOM-0001","HT-QOM-0002","HT-QOM-0003","HT-KSH-0002","HT-ISF-0001","HT-ISF-0002","HT-SRJ-0001","HT-SNH-0001","HT-NJF-0001","HT-BJR-0001","HT-KSH-0003","HT-QOM-0004","HT-SHB-0001","HT-TBZ-0001","HT-KSH-0004"];
      document.getElementById("grid").innerHTML = SKUS.map((sku) => {
        const slug = sku.toLowerCase();
        const path = `../public/media/carousel-info/${slug}-liquid-glass-info.png`;
        return `<article><a href="${path}" target="_blank"><img src="${path}" alt="${sku} liquid-glass information slide" loading="lazy" /></a><h2>${sku}</h2><a href="${path}" download="${slug}-liquid-glass-info.png">Download PNG</a></article>`;
      }).join("");
    </script>
  </body>
</html>
