<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hosseintalab — Art-directed liquid glass carousel</title>
    <style>
      @font-face {
        font-family: "Cormorant";
        src: url("../public/brand/fonts/cormorant-latin-variable.woff2") format("woff2");
        font-weight: 300 700;
      }

      @font-face {
        font-family: "Vazirmatn Latin";
        src: url("../node_modules/@fontsource-variable/vazirmatn/files/vazirmatn-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #181711;
      }

      .slide {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #181711;
        color: #f6f0e5;
      }

      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .shade {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgba(10, 9, 7, 0.42) 0%, transparent 22%),
          linear-gradient(90deg, rgba(12, 11, 8, 0.16) 0%, transparent 37%);
        pointer-events: none;
      }

      .brand {
        position: absolute;
        z-index: 3;
        top: 54px;
        right: 124px;
        width: 690px;
      }

      .brand img {
        display: block;
        width: 100%;
        height: auto;
      }

      .facts {
        position: absolute;
        z-index: 3;
        top: 375px;
        left: 50px;
        display: grid;
        width: 286px;
        gap: 18px;
      }

      .fact {
        position: relative;
        min-height: 116px;
        overflow: hidden;
        border: 1px solid rgba(233, 205, 150, 0.66);
        border-radius: 20px;
        padding: 22px 24px 18px;
        background: linear-gradient(135deg, rgba(74, 67, 54, 0.7), rgba(31, 29, 24, 0.61));
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.34),
          inset 10px 0 20px rgba(255, 221, 157, 0.035),
          0 18px 40px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(20px) saturate(1.08);
      }

      .fact::before {
        position: absolute;
        top: 11px;
        right: 17px;
        left: 17px;
        height: 1px;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0.34), rgba(255, 255, 255, 0.04));
        content: "";
      }

      .fact small {
        display: block;
        color: #e6c888;
        font: 700 12px/1 Arial, sans-serif;
        letter-spacing: 0.15em;
      }

      .fact strong {
        display: block;
        margin-top: 13px;
        color: #f8f2e8;
        font: 470 25px/1.04 "Cormorant", Georgia, serif;
        font-feature-settings: "lnum" 1, "tnum" 1;
        font-variant-numeric: lining-nums tabular-nums;
        letter-spacing: 0.025em;
      }

      .fact strong.long { font-size: 19px; }

      .fact strong.numeric {
        font-family: "Vazirmatn Latin", Arial, sans-serif;
        font-size: 22px;
        font-feature-settings: "lnum" 1, "tnum" 1;
        font-variant-numeric: lining-nums tabular-nums;
        font-weight: 540;
        letter-spacing: 0.01em;
      }

      .edition {
        position: absolute;
        z-index: 3;
        right: 53px;
        bottom: 30px;
        color: rgba(255, 255, 255, 0.52);
        font: 700 10px/1 Arial, sans-serif;
        letter-spacing: 0.2em;
      }
    </style>
  </head>
  <body>
    <main class="slide">
      <img class="scene" id="scene" alt="" />
      <div class="shade" aria-hidden="true"></div>
      <header class="brand">
        <img id="brand-logo" src="../public/brand/exports/hosseintalab-lockup-horizontal-reversed.svg" alt="Hosseintalab — Persian Handwoven Carpets — Est. 1290 SH" />
      </header>
      <section class="facts" id="facts" aria-label="Carpet information"></section>
      <div class="edition">ONE CARPET · ONE STORY</div>
    </main>
    <script>
      const CARPETS = {
        "HT-KSH-0001": { slug: "ht-ksh-0001", facts: [["CARPET", "KASHAN TREE OF LIFE"], ["ORIGIN", "KASHAN, IRAN"], ["DIMENSIONS", "138 × 217 CM"], ["MATERIAL", "WOOL & SILK"], ["AGE", "APPROX. 60–80 YEARS"]] },
        "HT-KHY-0001": { slug: "ht-khy-0001", facts: [["CARPET", "KHOY VASE CARPET"], ["ORIGIN", "KHOY, WEST AZERBAIJAN"], ["DIMENSIONS", "135 × 194 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 60–80 YEARS"]] },
        "HT-KRM-0001": { slug: "ht-krm-0001", facts: [["CARPET", "KERMAN MILLEFLEURS"], ["ORIGIN", "KERMAN, IRAN"], ["DESIGN", "MILLEFLEURS"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 70–80 YEARS"]] },
        "HT-NHV-0001": { slug: "ht-nhv-0001", facts: [["CARPET", "NUR ALI SHAH PORTRAIT"], ["ORIGIN", "NAHAVAND, HAMADAN"], ["DIMENSIONS", "135 × 190 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 120 YEARS"]] },
        "HT-RVR-0001": { slug: "ht-rvr-0001", facts: [["CARPET", "RAVAR TREE CARPET"], ["ORIGIN", "RAVAR, KERMAN"], ["DIMENSIONS", "136 × 213 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 110–140 YEARS"]] },
        "HT-QOM-0001": { slug: "ht-qom-0001", facts: [["CARPET", "QOM HUNTING SCENE"], ["ORIGIN", "QOM, IRAN"], ["DIMENSIONS", "165 × 255 CM"], ["MATERIAL", "SILK"], ["AGE", "APPROX. 40 YEARS"]] },
        "HT-QOM-0002": { slug: "ht-qom-0002", facts: [["CARPET", "QOM LAPIS HUNTING"], ["ORIGIN", "QOM, IRAN"], ["DIMENSIONS", "142 × 215 CM"], ["MATERIAL", "SILK DETAILS"], ["AGE", "APPROX. 40 YEARS"]] },
        "HT-QOM-0003": { slug: "ht-qom-0003", facts: [["CARPET", "QOM MEDALLION"], ["ORIGIN", "QOM, IRAN"], ["DIMENSIONS", "137 × 212 CM"], ["DESIGN", "MEDALLION & CORNER"], ["AGE", "APPROX. 60 YEARS"]] },
        "HT-KSH-0002": { slug: "ht-ksh-0002", facts: [["CARPET", "KASHAN OPEN-FIELD"], ["ORIGIN", "KASHAN, IRAN"], ["DIMENSIONS", "135 × 207 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 80–100 YEARS"]] },
        "HT-ISF-0001": { slug: "ht-isf-0001", facts: [["CARPET", "ISFAHAN MEDALLION"], ["ORIGIN", "ISFAHAN, IRAN"], ["DIMENSIONS", "154 × 242 CM"], ["MATERIAL", "KORK & SILK · SILK FOUNDATION"], ["AGE", "APPROX. 50–60 YEARS"]] },
        "HT-ISF-0002": { slug: "ht-isf-0002", facts: [["CARPET", "ISFAHAN HUNTING SCENE"], ["ORIGIN", "ISFAHAN, IRAN"], ["DIMENSIONS", "153 × 233 CM"], ["MATERIAL", "KORK & SILK · SILK FOUNDATION"], ["DESIGN", "HUNTING SCENE"]] },
        "HT-SRJ-0001": { slug: "ht-srj-0001", facts: [["CARPET", "SIRJAN TRIBAL CARPET"], ["ORIGIN", "SIRJAN, IRAN"], ["DIMENSIONS", "118 × 163 CM"], ["DESIGN", "TRIBAL DESIGN"], ["AGE", "APPROX. 40–50 YEARS"]] },
        "HT-SNH-0001": { slug: "ht-snh-0001", facts: [["CARPET", "SANANDAJ THREE-MEDALLION"], ["ORIGIN", "SANANDAJ, KURDISTAN"], ["DIMENSIONS", "114 × 168 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 60 YEARS"]] },
        "HT-NJF-0001": { slug: "ht-njf-0001", facts: [["CARPET", "NAJAFABAD MEDALLION"], ["ORIGIN", "NAJAFABAD, IRAN"], ["DIMENSIONS", "104 × 162 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 50 YEARS"]] },
        "HT-BJR-0001": { slug: "ht-bjr-0001", facts: [["CARPET", "BIJAR / JOZAN MEDALLION"], ["ORIGIN", "BIJAR / JOZAN"], ["DIMENSIONS", "114 × 153 CM"], ["DESIGN", "MEDALLION & CORNER"]] },
        "HT-KSH-0003": { slug: "ht-ksh-0003", facts: [["CARPET", "KASHAN MEDALLION"], ["ORIGIN", "KASHAN, IRAN"], ["DIMENSIONS", "131 × 212 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 60–70 YEARS"]] },
        "HT-QOM-0004": { slug: "ht-qom-0004", facts: [["CARPET", "QOM LAMP MIHRAB"], ["ORIGIN", "QOM, IRAN"], ["DIMENSIONS", "140 × 212 CM"], ["MATERIAL", "KORK WOOL"], ["AGE", "APPROX. 60 YEARS"]] },
        "HT-SHB-0001": { slug: "ht-shb-0001", facts: [["CARPET", "SHAHR BABAK MOHARRAMAT"], ["ORIGIN", "SHAHR BABAK / SIRJAN"], ["DESIGN", "MOHARRAMAT STRIPES"], ["AGE", "APPROX. 90–110 YEARS"]] },
        "HT-TBZ-0001": { slug: "ht-tbz-0001", facts: [["CARPET", "TABRIZ 60-RAJ MEDALLION"], ["ORIGIN", "TABRIZ, IRAN"], ["DIMENSIONS", "136 × 192 CM"], ["MATERIAL", "KORK WOOL"], ["AGE", "APPROX. 70–90 YEARS"]] },
        "HT-KSH-0004": { slug: "ht-ksh-0004", facts: [["CARPET", "KASHAN PICTORIAL LUMINARIES"], ["ORIGIN", "KASHAN, IRAN"], ["DIMENSIONS", "106 × 156 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 70 YEARS"]] }
      };

      const requested = new URLSearchParams(location.search).get("sku") || "HT-KSH-0001";
      const sku = CARPETS[requested] ? requested : "HT-KSH-0001";
      const carpet = CARPETS[sku];
      const scene = document.getElementById("scene");
      scene.src = `../public/media/carousel-scenes-v2/${carpet.slug}-scene.png`;
      scene.alt = `${sku} in an art-directed architectural setting`;
      document.getElementById("facts").innerHTML = carpet.facts.map(([label, value]) => `
        <article class="fact">
          <small>${label}</small>
          <strong class="${value.length > 18 ? "long" : ""} ${/\d/.test(value) ? "numeric" : ""}">${value}</strong>
        </article>
      `).join("");
      document.title = `${sku} — Art-directed liquid glass carousel`;
    </script>
  </body>
</html>
