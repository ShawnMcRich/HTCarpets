<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hosseintalab Reel CTA Renderer</title>
    <style>
      @font-face {
        font-family: "Vazirmatn";
        src: url("../node_modules/@fontsource-variable/vazirmatn/files/vazirmatn-arabic-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }

      @font-face {
        font-family: "Vazirmatn Latin";
        src: url("../node_modules/@fontsource-variable/vazirmatn/files/vazirmatn-latin-wght-normal.woff2") format("woff2");
        font-weight: 100 900;
      }

      @font-face {
        font-family: "Cormorant";
        src: url("../public/brand/fonts/cormorant-latin-variable.woff2") format("woff2");
        font-weight: 300 700;
      }

      :root {
        --forest: #0b211b;
        --forest-light: #17382e;
        --gold: #d6a85d;
        --gold-pale: #ead6ad;
        --paper: #f4efe5;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: var(--forest);
        color: var(--paper);
        font-family: "Vazirmatn", Tahoma, sans-serif;
      }

      .card {
        position: relative;
        display: grid;
        width: 100vw;
        height: 100vh;
        place-items: center;
        overflow: hidden;
        padding: 154px 105px 130px;
        background:
          radial-gradient(circle at 84% 10%, rgba(214, 168, 93, 0.23), transparent 27%),
          radial-gradient(circle at 8% 88%, rgba(77, 128, 107, 0.18), transparent 34%),
          linear-gradient(145deg, var(--forest-light), var(--forest) 60%);
        text-align: center;
      }

      .card::before,
      .card::after {
        position: absolute;
        width: 520px;
        height: 520px;
        border: 1px solid rgba(214, 168, 93, 0.19);
        content: "";
        transform: rotate(45deg);
      }

      .card::before { top: -220px; right: -240px; }
      .card::after { bottom: -270px; left: -220px; }

      .frame {
        position: absolute;
        inset: 42px;
        border: 1px solid rgba(214, 168, 93, 0.36);
      }

      .content {
        position: relative;
        z-index: 1;
        width: 100%;
      }

      .logo {
        display: block;
        width: 760px;
        max-width: 100%;
        height: auto;
        margin: 0 auto 116px;
      }

      .rule {
        width: 74px;
        height: 2px;
        margin: 0 auto 54px;
        background: var(--gold);
      }

      h1 {
        margin: 0;
        color: var(--paper);
        font-size: 58px;
        font-weight: 520;
        letter-spacing: -0.035em;
        line-height: 1.55;
      }

      .english {
        margin: 12px 0 0;
        color: rgba(255, 255, 255, 0.57);
        font-family: "Cormorant", Georgia, serif;
        font-size: 32px;
        font-feature-settings: "lnum" 1, "pnum" 1;
        font-variant-numeric: lining-nums proportional-nums;
        font-weight: 520;
        letter-spacing: 0.025em;
      }

      .route-note {
        margin: 78px auto 74px;
      }

      .route-note strong,
      .route-note span {
        display: block;
      }

      .route-note strong {
        color: var(--gold-pale);
        font-size: 34px;
        font-weight: 560;
      }

      .route-note span {
        margin-top: 8px;
        color: rgba(255, 255, 255, 0.52);
        font-family: "Vazirmatn Latin", Arial, sans-serif;
        font-size: 21px;
        font-feature-settings: "lnum" 1, "pnum" 1;
        font-variant-numeric: lining-nums proportional-nums;
        font-weight: 600;
        letter-spacing: 0.08em;
      }

      .contacts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-block: 1px solid rgba(214, 168, 93, 0.38);
      }

      .contact {
        padding: 34px 30px 32px;
      }

      .contact + .contact {
        border-right: 1px solid rgba(214, 168, 93, 0.38);
      }

      .contact span,
      .contact strong {
        display: block;
      }

      .contact span {
        color: rgba(255, 255, 255, 0.5);
        font-size: 18px;
        font-weight: 500;
      }

      .contact strong {
        margin-top: 9px;
        color: var(--paper);
        font-family: "Vazirmatn Latin", Arial, sans-serif;
        font-size: 27px;
        font-feature-settings: "lnum" 1, "tnum" 1;
        font-variant-numeric: lining-nums tabular-nums;
        font-weight: 600;
        letter-spacing: 0.015em;
        white-space: nowrap;
      }

      .contact strong.handle {
        font-size: 24px;
        font-variant-numeric: normal;
        letter-spacing: 0;
      }

      .website {
        margin: 55px 0 0;
        color: var(--gold-pale);
        font-family: "Cormorant", Georgia, serif;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="frame" aria-hidden="true"></div>
      <div class="content">
        <img class="logo" id="logo" src="../public/brand/exports/hosseintalab-lockup-horizontal-reversed.svg" alt="Hosseintalab" />
        <div class="rule" aria-hidden="true"></div>
        <h1>نام فرش یا اسکرین‌شات را بفرستید</h1>
        <p class="english" dir="ltr">Send the carpet name or a screenshot</p>
        <div class="route-note">
          <strong>دایرکت اینستاگرام یا واتساپ</strong>
          <span dir="ltr">INSTAGRAM DM OR WHATSAPP</span>
        </div>
        <div class="contacts" dir="ltr">
          <div class="contact"><span>INSTAGRAM DM</span><strong class="handle">@hosseintalab.carpets</strong></div>
          <div class="contact"><span>WHATSAPP</span><strong>+46 70 452 56 46</strong></div>
        </div>
        <p class="website" dir="ltr">hosseintalab.ir</p>
      </div>
    </main>
  </body>
</html>
