<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hosseintalab Liquid Glass Carousel Renderer</title>
    <script>
      window.__renderErrors = [];
      window.addEventListener("error", (event) => window.__renderErrors.push(event.message || "resource error"), true);
      window.addEventListener("unhandledrejection", (event) => window.__renderErrors.push(String(event.reason)));
    </script>
    <style>
      @font-face {
        font-family: "Cormorant";
        src: url("../public/brand/fonts/cormorant-latin-variable.woff2") format("woff2");
        font-weight: 300 700;
      }

      :root {
        --gold: #d6a85d;
        --gold-pale: #ead6ad;
        --paper: #f4efe5;
        --ink: #171812;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        background: #29271f;
        font-family: Arial, sans-serif;
      }

      .slide {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #29271f;
        color: var(--paper);
      }

      .backdrop {
        position: absolute;
        inset: -50px;
        width: calc(100% + 100px);
        height: calc(100% + 100px);
        object-fit: cover;
        filter: blur(40px) brightness(0.38) saturate(0.72);
        opacity: 0.78;
        transform: scale(1.08);
      }

      .atmosphere {
        position: absolute;
        inset: 0;
        background: rgba(18, 18, 14, 0.38);
      }

      .brand {
        position: absolute;
        z-index: 5;
        top: 25px;
        right: 0;
        left: 0;
        display: flex;
        justify-content: center;
      }

      .brand img {
        display: block;
        width: 760px;
        height: auto;
      }

      .product-stage {
        position: absolute;
        z-index: 2;
        top: 178px;
        right: 8px;
        bottom: 0;
        left: 220px;
        margin: 0;
      }

      .product-stage img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: right center;
        filter: drop-shadow(0 24px 36px rgba(0, 0, 0, 0.35));
      }

      .glass-stack {
        position: absolute;
        z-index: 4;
        top: 400px;
        bottom: 215px;
        left: 50px;
        display: flex;
        width: 286px;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
      }

      .glass-card {
        position: relative;
        display: flex;
        min-height: 110px;
        flex: 0 1 120px;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
        border: 1px solid rgba(234, 214, 173, 0.62);
        border-radius: 20px;
        padding: 19px 23px 18px;
        background: rgba(42, 37, 29, 0.66);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.3),
          0 16px 32px rgba(0, 0, 0, 0.28);
        backdrop-filter: blur(18px) saturate(1.12);
      }

      .glass-card::after {
        position: absolute;
        top: 11px;
        right: 17px;
        left: 17px;
        height: 1px;
        background: rgba(255, 255, 255, 0.16);
        content: "";
      }

      .glass-card small,
      .glass-card strong {
        display: block;
      }

      .glass-card small {
        color: var(--gold-pale);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.15em;
        line-height: 1.2;
      }

      .glass-card strong {
        margin-top: 11px;
        color: var(--paper);
        font-family: "Cormorant", Georgia, serif;
        font-size: 25px;
        font-feature-settings: "lnum" 1, "tnum" 1;
        font-variant-numeric: lining-nums tabular-nums;
        font-weight: 470;
        letter-spacing: 0.025em;
        line-height: 1.08;
      }

      .glass-card strong.is-long {
        font-size: 19px;
        line-height: 1.12;
      }

      .edition {
        position: absolute;
        z-index: 5;
        right: 54px;
        bottom: 35px;
        color: rgba(255, 255, 255, 0.4);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.2em;
      }
    </style>
  </head>
  <body>
    <main class="slide">
      <img class="backdrop" id="backdrop" alt="" />
      <div class="atmosphere" aria-hidden="true"></div>
      <header class="brand">
        <img id="brand-logo" src="../public/brand/exports/hosseintalab-lockup-horizontal-reversed.svg" alt="Hosseintalab — Persian Handwoven Carpets — Est. 1290 SH" />
      </header>
      <figure class="product-stage"><img id="carpet" alt="" /></figure>
      <section class="glass-stack" id="facts" aria-label="Carpet information"></section>
      <div class="edition">ONE CARPET · ONE STORY</div>
    </main>

    <script>
      const CARPETS = {
        "HT-KSH-0001": { slug: "ht-ksh-0001", facts: [["REFERENCE", "HT-KSH-0001"], ["ORIGIN", "KASHAN, IRAN"], ["DIMENSIONS", "138 × 217 CM"], ["MATERIAL", "WOOL & SILK"], ["AGE", "APPROX. 60–80 YEARS"]] },
        "HT-KHY-0001": { slug: "ht-khy-0001", facts: [["REFERENCE", "HT-KHY-0001"], ["ORIGIN", "KHOY, WEST AZERBAIJAN"], ["DIMENSIONS", "135 × 194 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 60–80 YEARS"]] },
        "HT-KRM-0001": { slug: "ht-krm-0001", facts: [["REFERENCE", "HT-KRM-0001"], ["ORIGIN", "KERMAN, IRAN"], ["DESIGN", "MILLEFLEURS"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 70–80 YEARS"]] },
        "HT-NHV-0001": { slug: "ht-nhv-0001", facts: [["REFERENCE", "HT-NHV-0001"], ["ORIGIN", "NAHAVAND, HAMADAN"], ["DIMENSIONS", "135 × 190 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 120 YEARS"]] },
        "HT-RVR-0001": { slug: "ht-rvr-0001", facts: [["REFERENCE", "HT-RVR-0001"], ["ORIGIN", "RAVAR, KERMAN"], ["DIMENSIONS", "136 × 213 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 110–140 YEARS"]] },
        "HT-QOM-0001": { slug: "ht-qom-0001", facts: [["REFERENCE", "HT-QOM-0001"], ["ORIGIN", "QOM, IRAN"], ["DIMENSIONS", "165 × 255 CM"], ["MATERIAL", "SILK"], ["AGE", "APPROX. 40 YEARS"]] },
        "HT-QOM-0002": { slug: "ht-qom-0002", facts: [["REFERENCE", "HT-QOM-0002"], ["ORIGIN", "QOM, IRAN"], ["DIMENSIONS", "142 × 215 CM"], ["MATERIAL", "SILK DETAILS"], ["AGE", "APPROX. 40 YEARS"]] },
        "HT-QOM-0003": { slug: "ht-qom-0003", facts: [["REFERENCE", "HT-QOM-0003"], ["ORIGIN", "QOM, IRAN"], ["DIMENSIONS", "137 × 212 CM"], ["DESIGN", "MEDALLION & CORNER"], ["AGE", "APPROX. 60 YEARS"]] },
        "HT-KSH-0002": { slug: "ht-ksh-0002", facts: [["REFERENCE", "HT-KSH-0002"], ["ORIGIN", "KASHAN, IRAN"], ["DIMENSIONS", "135 × 207 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 80–100 YEARS"]] },
        "HT-ISF-0001": { slug: "ht-isf-0001", facts: [["REFERENCE", "HT-ISF-0001"], ["ORIGIN", "ISFAHAN, IRAN"], ["DIMENSIONS", "154 × 242 CM"], ["MATERIAL", "KORK & SILK · SILK FOUNDATION"], ["AGE", "APPROX. 50–60 YEARS"]] },
        "HT-ISF-0002": { slug: "ht-isf-0002", facts: [["REFERENCE", "HT-ISF-0002"], ["ORIGIN", "ISFAHAN, IRAN"], ["DIMENSIONS", "153 × 233 CM"], ["MATERIAL", "KORK & SILK · SILK FOUNDATION"], ["DESIGN", "HUNTING SCENE"]] },
        "HT-SRJ-0001": { slug: "ht-srj-0001", facts: [["REFERENCE", "HT-SRJ-0001"], ["ORIGIN", "SIRJAN, IRAN"], ["DIMENSIONS", "118 × 163 CM"], ["DESIGN", "TRIBAL DESIGN"], ["AGE", "APPROX. 40–50 YEARS"]] },
        "HT-SNH-0001": { slug: "ht-snh-0001", facts: [["REFERENCE", "HT-SNH-0001"], ["ORIGIN", "SANANDAJ, KURDISTAN"], ["DIMENSIONS", "114 × 168 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 60 YEARS"]] },
        "HT-NJF-0001": { slug: "ht-njf-0001", facts: [["REFERENCE", "HT-NJF-0001"], ["ORIGIN", "NAJAFABAD, IRAN"], ["DIMENSIONS", "104 × 162 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 50 YEARS"]] },
        "HT-BJR-0001": { slug: "ht-bjr-0001", facts: [["REFERENCE", "HT-BJR-0001"], ["ORIGIN", "BIJAR / JOZAN"], ["DIMENSIONS", "114 × 153 CM"], ["DESIGN", "MEDALLION & CORNER"]] },
        "HT-KSH-0003": { slug: "ht-ksh-0003", facts: [["REFERENCE", "HT-KSH-0003"], ["ORIGIN", "KASHAN, IRAN"], ["DIMENSIONS", "131 × 212 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 60–70 YEARS"]] },
        "HT-QOM-0004": { slug: "ht-qom-0004", facts: [["REFERENCE", "HT-QOM-0004"], ["ORIGIN", "QOM, IRAN"], ["DIMENSIONS", "140 × 212 CM"], ["MATERIAL", "KORK WOOL"], ["AGE", "APPROX. 60 YEARS"]] },
        "HT-SHB-0001": { slug: "ht-shb-0001", facts: [["REFERENCE", "HT-SHB-0001"], ["ORIGIN", "SHAHR BABAK / SIRJAN"], ["DESIGN", "MOHARRAMAT STRIPES"], ["AGE", "APPROX. 90–110 YEARS"]] },
        "HT-TBZ-0001": { slug: "ht-tbz-0001", facts: [["REFERENCE", "HT-TBZ-0001"], ["ORIGIN", "TABRIZ, IRAN"], ["DIMENSIONS", "136 × 192 CM"], ["MATERIAL", "KORK WOOL"], ["AGE", "APPROX. 70–90 YEARS"]] },
        "HT-KSH-0004": { slug: "ht-ksh-0004", facts: [["REFERENCE", "HT-KSH-0004"], ["ORIGIN", "KASHAN, IRAN"], ["DIMENSIONS", "106 × 156 CM"], ["MATERIAL", "WOOL"], ["AGE", "APPROX. 70 YEARS"]] }
      };

      const requested = new URLSearchParams(location.search).get("sku") || "HT-KSH-0001";
      const sku = CARPETS[requested] ? requested : "HT-KSH-0001";
      const carpet = CARPETS[sku];
      const imagePath = `../public/media/products/${carpet.slug}/full-frontal.png`;
      document.getElementById("carpet").src = imagePath;
      document.getElementById("carpet").alt = `${sku} full-frontal carpet photograph`;
      document.getElementById("backdrop").src = imagePath;
      document.getElementById("facts").innerHTML = carpet.facts.map(([label, value]) => `
        <article class="glass-card">
          <small>${label}</small>
          <strong class="${value.length > 18 ? "is-long" : ""}">${value}</strong>
        </article>
      `).join("");
      document.title = `${sku} Liquid Glass Carousel Slide`;
    </script>
  </body>
</html>
