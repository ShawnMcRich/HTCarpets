server {
    listen 80;
    listen [::]:80;
    server_name hosseintalab.ir www.hosseintalab.ir;

    root /var/www/hosseintalab.ir/current;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 308 https://hosseintalab.ir$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hosseintalab.ir;

    ssl_certificate /etc/letsencrypt/live/hosseintalab.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hosseintalab.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://hosseintalab.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hosseintalab.ir;

    root /var/www/hosseintalab.ir/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/hosseintalab.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hosseintalab.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|woff2|png|jpe?g|webp|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
