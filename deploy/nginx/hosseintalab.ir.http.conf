server {
    listen 80;
    listen [::]:80;
    server_name hosseintalab.ir www.hosseintalab.ir;

    root /var/www/hosseintalab.ir/current;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
